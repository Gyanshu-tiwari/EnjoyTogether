<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnjoyTogether</title>
    <meta name="description" content="Watch together, feel closer. The premium movie room with real-time chat, crystal clear video, and perfectly synced playback for you and your friends." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet" />
    <link rel="preload" href="/hero.avif" as="image" />
    <style>
      body {
        margin: 0;
        background-color: #0a0a0a;
        color: white;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .html-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1.5rem;
        z-index: 100;
        box-sizing: border-box;
        background-color: #0a0a0a;
        transform-origin: top;
        will-change: transform, border-radius;
      }
      @media (min-width: 768px) {
        .html-loader {
          padding: 3rem;
        }
      }
      .loader-logo {
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: -0.015em;
      }
      .loader-line-container {
        position: absolute;
        top: 50%;
        left: 1.5rem;
        right: 1.5rem;
        transform: translateY(-50%);
        height: 1px;
        background-color: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      @media (min-width: 768px) {
        .loader-line-container {
          left: 3rem;
          right: 3rem;
        }
      }
      .loader-line {
        height: 100%;
        width: 0%;
        background-color: white;
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: left;
      }
      .loader-counter-container {
        display: flex;
        justify-content: flex-end;
        align-items: flex-end;
        height: 100%;
      }
      .loader-counter {
        display: flex;
        align-items: baseline;
      }
      .loader-number {
        font-size: 6rem;
        font-weight: 300;
        letter-spacing: -0.05em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .loader-percent {
        font-size: 1.875rem;
        font-weight: 300;
        line-height: 1;
        margin-bottom: 0.5rem;
      }
      @media (min-width: 768px) {
        .loader-number { font-size: 12rem; }
        .loader-percent { font-size: 3rem; margin-bottom: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <!-- The HTML Loader is outside the root so React doesn't wipe it out immediately, allowing it to animate out smoothly -->
    <div class="html-loader" id="native-loader">
      <div style="display: flex; justify-content: flex-start;">
        <span class="loader-logo">EnjoyTogether®</span>
      </div>
      
      <div class="loader-line-container">
        <div class="loader-line" id="native-loader-line"></div>
      </div>
      
      <div class="loader-counter-container">
        <div class="loader-counter">
          <span class="loader-number" id="native-loader-num">0</span>
          <span class="loader-percent">%</span>
        </div>
      </div>
    </div>
    
    <script>
      (function() {
        let progress = 0;
        const numEl = document.getElementById('native-loader-num');
        const lineEl = document.getElementById('native-loader-line');
        const loaderEl = document.getElementById('native-loader');
        
        const startTime = performance.now();
        let animationFrame;
        
        function updateProgress(timestamp) {
          if (window.__APP_LOADED__) return;
          
          if (window.location.pathname !== '/') {
            if (loaderEl) loaderEl.remove();
            window.__APP_LOADED__ = true;
            return;
          }
          
          const elapsed = timestamp - startTime;
          // Asymptotic progress curve: reaches ~95% over 15 seconds (typical slow 3G)
          // Adjust formula for a realistic perceived loading speed
          const target = 99 * (1 - Math.exp(-elapsed / 6000));
          
          progress = target;
          if (numEl) numEl.textContent = Math.floor(progress);
          if (lineEl) lineEl.style.width = progress + '%';
          
          animationFrame = requestAnimationFrame(updateProgress);
        }
        
        animationFrame = requestAnimationFrame(updateProgress);
        
        window.finishLoading = function() {
          if (window.__APP_LOADED__) return;
          window.__APP_LOADED__ = true;
          cancelAnimationFrame(animationFrame);
          
          const startProgress = progress;
          const finishStartTime = performance.now();
          
          function finishAnim(timestamp) {
            const elapsed = timestamp - finishStartTime;
            const t = Math.min(elapsed / 400, 1); // 400ms to zip to 100%
            
            // easeOutQuad
            const easeT = t * (2 - t);
            
            progress = startProgress + (100 - startProgress) * easeT;
            if (numEl) numEl.textContent = Math.floor(progress);
            if (lineEl) lineEl.style.width = progress + '%';
            
            if (t < 1) {
              requestAnimationFrame(finishAnim);
            } else {
              if (loaderEl) {
                // Trigger the Framer-style curtain exit
                loaderEl.style.transition = 'transform 0.6s cubic-bezier(0.76, 0, 0.24, 1), border-radius 0.6s cubic-bezier(0.76, 0, 0.24, 1)';
                loaderEl.style.borderBottomLeftRadius = '50%';
                loaderEl.style.borderBottomRightRadius = '50%';
                loaderEl.style.transform = 'translateY(-100%)';
                
                setTimeout(() => {
                  loaderEl.remove();
                }, 600);
              }
            }
          }
          requestAnimationFrame(finishAnim);
        };
      })();
    </script>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
